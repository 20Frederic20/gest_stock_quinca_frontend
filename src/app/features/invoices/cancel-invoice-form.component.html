<form [formGroup]="form" (ngSubmit)="submit()">
  <p class="intro">
    Annulation de : <strong>{{ summary() }}</strong><br />
    Le document reste enregistré, marqué comme annulé. Le stock réservé est libéré.
  </p>

  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label for="cancelReason">Motif de l’annulation</label>
    <input id="cancelReason" formControlName="reason" maxlength="255" autocomplete="off" placeholder="Erreur de client, vente abandonnée…" />
    <app-field-error [control]="form.controls.reason" [serverError]="fieldErrors()['reason']" />
  </div>

  <div class="actions">
    <button type="button" class="btn icon-back" (click)="cancelled.emit()">Retour</button>
    <button type="submit" class="btn btn-danger" [disabled]="saving()">
      {{ saving() ? 'Annulation…' : 'Annuler le document' }}
    </button>
  </div>
</form>
