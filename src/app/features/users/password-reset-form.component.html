<form [formGroup]="form" (ngSubmit)="submit()">
  <p class="intro">
    Nouveau mot de passe pour <strong>{{ userName() }}</strong>. Transmettez-le à l’utilisateur :
    il pourra le changer ensuite.
  </p>

  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label for="newPassword">Nouveau mot de passe</label>
    <input id="newPassword" type="password" formControlName="newPassword" maxlength="100" autocomplete="new-password" />
    <app-field-error [control]="form.controls.newPassword" />
  </div>

  <div class="field">
    <label for="confirmation">Confirmation</label>
    <input id="confirmation" type="password" formControlName="confirmation" maxlength="100" autocomplete="new-password" />
    <app-field-error [control]="form.controls.confirmation" />
    @if (showMismatch()) {
      <p class="mismatch">Les deux mots de passe ne sont pas identiques</p>
    }
  </div>

  <div class="actions">
    <button type="button" class="btn icon-cancel" (click)="cancelled.emit()">Annuler</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Enregistrement…' : 'Réinitialiser' }}
    </button>
  </div>
</form>
