<main class="page">
  <div class="card">
    <div class="brand">
      <img class="logo" src="/images/logo.jpeg" alt="Quincaillerie Le Chantier" width="72" height="72" />
      <div class="brand-name">Quincaillerie Le Chantier</div>
      <div class="brand-subtitle">Gestion de stock</div>
    </div>

    <h1>Connexion</h1>

    @if (startupError()) {
      <p class="notice" role="status">{{ startupError() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <div class="field">
        <label for="username">Identifiant</label>
        <input id="username" formControlName="username" autocomplete="username" autocapitalize="none" spellcheck="false" />
        <app-field-error [control]="form.controls.username" />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        <app-field-error [control]="form.controls.password" />
      </div>

      <button type="submit" class="btn btn-primary submit" [disabled]="submitting()">
        {{ submitting() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>
  </div>
</main>
