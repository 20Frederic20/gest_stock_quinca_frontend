<form [formGroup]="form" (ngSubmit)="submit()">
  <p class="intro">
    Annulation de : <strong>{{ summary() }}</strong><br />
    La commande reste enregistrée, marquée comme annulée. Le fournisseur doit en être averti séparément.
  </p>

  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label for="cancelOrderReason">Motif de l’annulation</label>
    <input
      id="cancelOrderReason"
      formControlName="reason"
      maxlength="255"
      autocomplete="off"
      placeholder="Fournisseur en rupture, commande en double…" />
    <app-field-error [control]="form.controls.reason" [serverError]="fieldErrors()['reason']" />
  </div>

  <div class="actions">
    <button type="button" class="btn icon-back" (click)="cancelled.emit()">Retour</button>
    <button type="submit" class="btn btn-danger" [disabled]="saving()">
      {{ saving() ? 'Annulation…' : 'Annuler la commande' }}
    </button>
  </div>
</form>
