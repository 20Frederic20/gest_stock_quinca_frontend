<form [formGroup]="form" (ngSubmit)="submit()">
  <p class="intro">
    Annulation de : <strong>{{ summary() }}</strong><br />
    La réception reste enregistrée, marquée comme annulée. La marchandise ressort du stock et redevient attendue.
  </p>

  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label for="cancelReceptionReason">Motif de l’annulation</label>
    <input
      id="cancelReceptionReason"
      formControlName="reason"
      maxlength="255"
      autocomplete="off"
      placeholder="Marchandise refusée, erreur de saisie…" />
    <app-field-error [control]="form.controls.reason" [serverError]="fieldErrors()['reason']" />
  </div>

  <div class="actions">
    <button type="button" class="btn" (click)="cancelled.emit()">Retour</button>
    <button type="submit" class="btn btn-danger" [disabled]="saving()">
      {{ saving() ? 'Annulation…' : 'Annuler la réception' }}
    </button>
  </div>
</form>
