<form [formGroup]="form" (ngSubmit)="submit()">
  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label>Agence source</label>
    <p class="static">{{ sourceAgencyLabel() }}</p>
    <p class="hint">Votre agence : c’est elle qui expédiera la marchandise.</p>
  </div>

  <div class="field">
    <label>Agence destinataire</label>
    <app-select-search
      [options]="destinationOptions()"
      [value]="form.controls.destinationAgencyId.value"
      [label]="destinationLabel()"
      placeholder="Choisir une agence"
      (selected)="onDestinationSelected($event)" />
    <app-field-error [control]="form.controls.destinationAgencyId" />
  </div>

  <div class="field">
    <label for="transferDate">Date du transfert</label>
    <input id="transferDate" type="date" formControlName="transferDate" />
    <p class="hint">Facultatif : aujourd’hui par défaut.</p>
  </div>

  <div class="field">
    <label for="transferComment">Commentaire</label>
    <input
      id="transferComment"
      formControlName="comment"
      maxlength="500"
      autocomplete="off"
      placeholder="Réassort suite à rupture, redéploiement…" />
    <app-field-error [control]="form.controls.comment" />
  </div>

  <p class="hint">Les articles s’ajoutent ensuite, sur le transfert.</p>

  <div class="actions">
    <button type="button" class="btn icon-cancel" (click)="cancelled.emit()">Annuler</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Création…' : 'Créer le transfert' }}
    </button>
  </div>
</form>
