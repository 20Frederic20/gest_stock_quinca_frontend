<form [formGroup]="form" (ngSubmit)="submit()">
  <p class="intro">
    Annulation de : <strong>{{ summary() }}</strong><br />
    Le bon reste enregistré, marqué comme annulé. La marchandise revient en stock, réservée pour le client.
  </p>

  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label for="cancelDeliveryReason">Motif de l’annulation</label>
    <input
      id="cancelDeliveryReason"
      formControlName="reason"
      maxlength="255"
      autocomplete="off"
      placeholder="Marchandise retournée, erreur de saisie…" />
    <app-field-error [control]="form.controls.reason" [serverError]="fieldErrors()['reason']" />
  </div>

  <div class="actions">
    <button type="button" class="btn icon-back" (click)="cancelled.emit()">Retour</button>
    <button type="submit" class="btn btn-danger" [disabled]="saving()">
      {{ saving() ? 'Annulation…' : 'Annuler le bon' }}
    </button>
  </div>
</form>
