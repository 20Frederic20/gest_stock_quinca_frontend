<form [formGroup]="form" (ngSubmit)="submit()">
  <p class="intro">
    Annulation de : <strong>{{ summary() }}</strong><br />
    Un mouvement inverse sera enregistré. Le mouvement d’origine reste visible dans l’historique.
  </p>

  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label for="reversalReason">Motif de l’annulation</label>
    <input id="reversalReason" formControlName="reason" maxlength="255" autocomplete="off" placeholder="Saisie en double, erreur de quantité…" />
    <app-field-error [control]="form.controls.reason" [serverError]="fieldErrors()['reason']" />
  </div>

  <div class="actions">
    <button type="button" class="btn icon-back" (click)="cancelled.emit()">Retour</button>
    <button type="submit" class="btn btn-danger" [disabled]="saving()">
      {{ saving() ? 'Annulation…' : 'Annuler le mouvement' }}
    </button>
  </div>
</form>
