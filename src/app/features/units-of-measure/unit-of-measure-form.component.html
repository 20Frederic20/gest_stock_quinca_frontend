<form [formGroup]="form" (ngSubmit)="submit()">
  @if (formError()) {
    <p class="form-error">{{ formError() }}</p>
  }

  <div class="field">
    <label for="code">Code</label>
    <input id="code" formControlName="code" maxlength="20" autocomplete="off" />
    <app-field-error [control]="form.controls.code" [serverError]="fieldErrors()['code']" />
  </div>

  <div class="field">
    <label for="label">Libellé</label>
    <input id="label" formControlName="label" maxlength="100" autocomplete="off" />
    <app-field-error [control]="form.controls.label" [serverError]="fieldErrors()['label']" />
  </div>

  <div class="actions">
    <button type="button" class="btn" (click)="cancelled.emit()">Annuler</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
    </button>
  </div>
</form>
