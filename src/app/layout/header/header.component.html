<div class="bar">
  <div class="context">{{ today }}</div>

  <div class="agency">
    <span class="text-muted">Agence</span>
    @if (canSwitchAgency()) {
      <div class="agency-switch" (click)="$event.stopPropagation()">
        <app-select-search
          [options]="agencyOptions()"
          [value]="viewedAgencyId()"
          [label]="viewedAgencyLabel()"
          placeholder="Choisir une agence"
          (selected)="onAgencySelected($event)" />
      </div>
    } @else {
      <span class="tag">{{ viewedAgencyLabel() }}</span>
    }

    <div class="user-wrap" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="user"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        [attr.aria-label]="'Compte de ' + (user()?.name ?? '')"
        (click)="toggleMenu($event)">
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="user-name">{{ user()?.name }}</span>
        <span class="chevron" aria-hidden="true">▾</span>
      </button>

      @if (menuOpen()) {
        <div class="user-menu" role="menu">
          <div class="identity">
            <span class="avatar large" aria-hidden="true">{{ initials() }}</span>
            <div>
              <div class="name">{{ user()?.name }}</div>
              <div class="line text-muted">{{ roleLabel() }}</div>
              <div class="line text-muted">{{ user()?.agencyLabel }}</div>
            </div>
          </div>

          <button type="button" class="btn btn-ghost logout" [disabled]="loggingOut()" (click)="logout()">
            {{ loggingOut() ? 'Déconnexion…' : 'Se déconnecter' }}
          </button>
        </div>
      }
    </div>
  </div>
</div>

<div class="rule-accent"></div>
<div class="rule-thin"></div>
