<div class="bar">
  <div class="context">{{ today }} · {{ userName }}</div>
  <div class="agency">
    <span class="text-muted">Agence</span>
    <app-select-search
      [options]="agencyOptions()"
      [value]="current()?.id ?? null"
      [label]="current()?.label ?? ''"
      [placeholder]="loaded() ? 'Aucune agence' : 'Chargement…'"
      (selected)="onAgencySelected($event)" />
  </div>
</div>

<div class="rule-accent"></div>
<div class="rule-thin"></div>
